<!DOCTYPE html>
<html>
<head>
    <title>FCM Test</title>
</head>
<body>

    <h1>FCM Push Test</h1>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

        import {
            getMessaging,
            getToken
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";

        const firebaseConfig = {
                                apiKey: "AIzaSyCAMVp2PcY8jNLtFxb97TgXsv_dEu6KbMQ",
                                authDomain: "naaspushnotificationdemo.firebaseapp.com",
                                projectId: "naaspushnotificationdemo",
                                storageBucket: "naaspushnotificationdemo.firebasestorage.app",
                                messagingSenderId: "293198418843",
                                appId: "1:293198418843:web:f17f563fd0f654ce8bc73e",
                                measurementId: "G-P1XESVQD98"
                                };

        const app = initializeApp(firebaseConfig);

        const messaging = getMessaging(app);

        async function main() {

            const permission = await Notification.requestPermission();

            console.log("Permission:", permission);

            if (permission !== "granted") {
                console.log("Notification permission denied");
                return;
            }

            const token = await getToken(messaging, {
                vapidKey: "BCM9L3ENZxdMBO7X28-k4YvHe27dioyN_CRapN85oNBQk0zZkCnYS4uH2p9Jbpu7sKExYHiKpSoWVSn8R-SI4AA"
            });

            console.log("FCM TOKEN:");
            console.log(token);
        }

        main();

    </script>

</body>
</html>
